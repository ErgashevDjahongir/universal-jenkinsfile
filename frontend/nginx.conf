# E-TEST — Nginx server bloki (frontend image ichida).
# Vazifasi:
#   1) React SPA static fayllarini tarqatish
#   2) /api so'rovlarini backend konteyneriga proxy qilish
#   3) Yuklangan hujjatlar (candidate PDF) FAQAT backend orqali, auth bilan beriladi —
#      Nginx ularni to'g'ridan-to'g'ri ochmaydi (alohida /uploads location yo'q, ataylab).

# gzip — matn aktivlari uchun
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain text/css application/json application/javascript
  application/x-javascript text/xml application/xml application/xml+rss
  text/javascript image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Yuklash hajmi backend chekloviga mos (candidate PDF = 10 MB) + bir oz zaxira
    client_max_body_size 12m;

    # Xavfsizlik sarlavhalari
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API -> backend. Yuklangan fayllar ham shu yo'l orqali (auth bilan) keladi.
    location /api/ {
        # Docker'ning ichki DNS'i (127.0.0.11) orqali so'rov vaqtida hal qilamiz.
        # `proxy_pass`'da o'zgaruvchi ishlatilgani uchun backend konteyneri qayta
        # yaratilib IP'si o'zgarsa ham (rebuild), Nginx yangi IP'ni oladi —
        # eski IP'ga qotib qolib 502 bermaydi. URI o'zgarmasdan uzatiladi.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fayl yuklash/yuklab olish uchun uzaytirilgan timeout'lar
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # StreamableFile (PDF) ni oqim sifatida uzatish — bufferlamaymiz
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Hashlangan statik aktivlar — uzoq muddatli kesh
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — qolgan barcha yo'llar index.html ga (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
